[project]
name = "slacken"
version = "0.1.0"
description = "Slack #food への食事投稿をNotion DBに取り込む"
requires-python = ">=3.11"
dependencies = [
    "slack-sdk>=3.27",
    "google-genai>=1.0",
    "requests>=2.32",
]

[project.scripts]
slacken = "slacken.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slacken"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
