name: sync

on:
  schedule:
    # JST 6:00-24:00 のみ毎時 (UTC 21-23, 0-15)。深夜1-5時 (JST) はスキップ
    - cron: "0 21-23,0-15 * * *"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "遡って取り込む時間 (時間)"
        required: false
        default: "168"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"

      - name: install
        run: uv sync --frozen

      - name: run sync
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
        run: uv run slacken
